<!DOCTYPE html>
<html>
<head>
    <title>AI Chatbot</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f4f8;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }

        .chat {
            width: 400px;
            background: white;
            padding: 20px;
            border-radius: 15px;
        }

        #messages {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
        }

        input {
            width: 70%;
            padding: 12px;
            margin-top: 10px;
        }

        button {
            padding: 12px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="chat">

    <h2>AI Chatbot</h2>

    <div id="messages">
        <p><b>Bot:</b> Hello! How can I help you?</p>
    </div>

    <input type="text" id="message" placeholder="Type your message...">

    <button onclick="sendMessage()">Send</button>

</div>

<script>
async function sendMessage() {

    const input = document.getElementById("message");
    const message = input.value.trim();

    if (message === "") {
        return;
    }

    const messages = document.getElementById("messages");

    messages.innerHTML +=
        "<p><b>You:</b> " + message + "</p>";

    input.value = "";

    const response = await fetch("/chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            message: message
        })
    });

    const data = await response.json();

    messages.innerHTML +=
        "<p><b>Bot:</b> " + data.response + "</p>";

    messages.scrollTop = messages.scrollHeight;
}
</script>

</body>
</html>
